# Mutaciones con nombre de TASK-572 (foto del episodio de la sombra; A-112). Rutas desde la raíz.
# Formato de tabla_guardas.py (skill vigia-calidad-antes-del-pr). Esta sesión no puede usar git
# fuera de su worktree: se corrió con un ejecutor equivalente (línea base en verde, mutación del
# texto exacto, salida 1, restauración verificada por SHA-256; cobertura de condiciones nuevas
# frente a una copia de main con difflib). Las de integración necesitan Docker; en Docker
# Desktop con la carrera del mapeo de puertos, el adaptador port_retry de docs/evidence/VIG-394.
base = "origin/main"
comando = "uv run --frozen --project backend pytest -q -p no:cacheprovider -x -p port_retry -W ignore::hypothesis.errors.HypothesisWarning"

