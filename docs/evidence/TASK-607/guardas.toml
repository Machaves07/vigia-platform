# Mutaciones con nombre de TASK-607 (relevo firmado del almacén; A-130) y una por guarda nueva de
# seguridad. Formato de tabla_guardas.py (skill vigia-calidad-antes-del-pr). Rutas desde la raíz.
# Todas caen con una prueba unitaria aislada (S3 en memoria, sin Docker); el recorrido contra
# LocalStack es backend/tests/integration/test_store_relay_routes.py.
base = "origin/main"
comando = "uv run --frozen --project backend pytest -q -p no:cacheprovider -x -W ignore::hypothesis.errors.HypothesisWarning"

# --- Mutaciones con nombre de la tarea ----------------------------------------------------------

[[guarda]]
nombre = "m_sin_rango: se ignora Range"
archivo = "backend/src/vigia_platform/shared/api/store_relay.py"
buscar = "        span = byte_range(_single(request.headers.getlist(\"range\")), size)\n"
reemplazar = "        span = None\n"
prueba = "backend/tests/unit/test_store_relay_route.py::test_a_range_serves_exactly_those_bytes_with_206"

