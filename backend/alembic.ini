# Alembic de vigia-platform (TASK-106, LC-NUC-12, PAT-NUC-MAN-09, NFR-NUC-14).
#
# Una sola cadena lineal, compartida por U-02, U-03 y U-04, y solo hacia adelante:
#   - revisión `<unidad>_<NNNN>`: `nuc_` (U-02), `gob_` (U-03), `laz_` (U-04); NNNN es la posición
#     del eslabón en la cadena, que es también lo que devuelve `shared.vigia_schema_version()`;
#   - cada unidad solo añade eslabones al final; `downgrade` lanza `NotImplementedError`;
#   - `tools/lint_migrations.py` lo comprueba en cada corrida de pytest.
#
# Nueva migración (desde backend/), con el número siguiente al de la cabeza:
#   uv run alembic revision --rev-id nuc_0002 -m "identity tables"
#
# Conexión: variables estándar de libpq (PGHOST, PGPORT, PGUSER, PGPASSWORD, PGDATABASE,
# PGSSLMODE, PGSSLROOTCERT), que lee asyncpg; ninguna URL ni contraseña en este archivo.
# `make migrate` las fija para el PostgreSQL de docker-compose.

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 60
prepend_sys_path = .
path_separator = os
output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
