# Configuración de ruff para src/: la de backend/pyproject.toml más la prohibición del registro
# de la biblioteca estándar (revisión de VIG-22, ronda 2). Una plantilla % guardada en una
# variable y pasada a un registrador de logging no la ven ni las reglas G ni VIG004: en src/
# se registra solo con shared.observability.logging.get_logger. El propio módulo de
# observabilidad usa logging con `# noqa: TID251` línea a línea.
#
# ruff sustituye (no amplía) la tabla banned-api al extender: aquí se repite entera la de
# pyproject.toml. tests/unit/test_lint_rules.py::test_src_ruff_config_keeps_every_root_ban
# falla si alguna entrada de la raíz falta aquí.
extend = "../pyproject.toml"

[lint.flake8-tidy-imports.banned-api]
"pickle".msg = "Prohibido por NFR-NUC-27: usa JSON validado por los modelos."
"_pickle".msg = "Prohibido por NFR-NUC-27: usa JSON validado por los modelos."
