"components":
  "schemas":
    "ActivationEnrollment":
      "properties":
        "provisioning_uri":
          "type": "string"
          "title": "Provisioning Uri"
        "qr_svg":
          "type": "string"
          "title": "Qr Svg"
        "recovery_codes":
          "items":
            "type": "string"
          "type": "array"
          "title": "Recovery Codes"
      "additionalProperties": false
      "type": "object"
      "required":
        - "provisioning_uri"
        - "qr_svg"
        - "recovery_codes"
      "title": "ActivationEnrollment"
    "ActivationResponse":
      "properties":
        "status":
          "type": "string"
          "enum":
            - "pending"
            - "activated"
          "title": "Status"
        "second_factor_required":
          "anyOf":
            - "type": "boolean"
            - "type": "null"
          "title": "Second Factor Required"
        "enrollment":
          "anyOf":
            - "$ref": "#/components/schemas/ActivationEnrollment"
            - "type": "null"
        "notice":
          "anyOf":
            - "$ref": "#/components/schemas/NoticeView"
            - "type": "null"
      "additionalProperties": false
      "type": "object"
      "required":
        - "status"
      "title": "ActivationResponse"
    "ApiErrorBody":
      "additionalProperties": false
      "description": "Cuerpo JSON de toda respuesta de error (domain-entities §4.4, pendiente nº 33)."
      "properties":
        "code":
          "$ref": "#/components/schemas/ApiErrorCode"
        "detail_code":
          "anyOf":
            - "maxLength": 64
              "pattern": "[a-z][a-z0-9]*(?:_[a-z0-9]+)+"
              "type": "string"
            - "type": "null"
          "default": null
          "title": "Detail Code"
        "message_es":
          "maxLength": 256
          "minLength": 1
          "title": "Message Es"
          "type": "string"
        "correlation_id":
          "format": "uuid"
          "title": "Correlation Id"
          "type": "string"
        "retry_after_seconds":
          "anyOf":
