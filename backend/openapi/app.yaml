"components":
  "schemas":
    "AcceptanceStatus":
      "type": "string"
      "enum":
        - "accepted"
        - "accepted_duplicate"
      "title": "AcceptanceStatus"
      "description": "Resultado de aceptación de un registro por la plataforma."
    "ActivationEnrollment":
      "properties":
        "provisioning_uri":
          "type": "string"
          "title": "Provisioning Uri"
        "qr_svg":
          "type": "string"
          "title": "Qr Svg"
        "recovery_codes":
          "items":
            "type": "string"
          "type": "array"
          "title": "Recovery Codes"
      "additionalProperties": false
      "type": "object"
      "required":
        - "provisioning_uri"
        - "qr_svg"
        - "recovery_codes"
      "title": "ActivationEnrollment"
    "ActivationResponse":
      "properties":
        "status":
          "type": "string"
          "enum":
            - "pending"
            - "activated"
          "title": "Status"
        "second_factor_required":
          "anyOf":
            - "type": "boolean"
            - "type": "null"
          "title": "Second Factor Required"
        "enrollment":
          "anyOf":
            - "$ref": "#/components/schemas/ActivationEnrollment"
            - "type": "null"
        "notice":
          "anyOf":
            - "$ref": "#/components/schemas/NoticeView"
            - "type": "null"
      "additionalProperties": false
      "type": "object"
      "required":
        - "status"
      "title": "ActivationResponse"
    "ActorOut":
      "properties":
        "kind":
          "type": "string"
          "title": "Kind"
        "id":
          "type": "string"
          "format": "uuid"
          "title": "Id"
        "display_name_snapshot":
          "type": "string"
          "title": "Display Name Snapshot"
        "role_in_use":
          "anyOf":
            - "type": "string"
            - "type": "null"
          "title": "Role In Use"
        "concession_id":
          "anyOf":
            - "type": "string"
              "format": "uuid"
            - "type": "null"
          "title": "Concession Id"
        "unit":
          "type": "string"
          "title": "Unit"
      "additionalProperties": false
      "type": "object"
      "required":
        - "kind"
        - "id"
        - "display_name_snapshot"
        - "role_in_use"
        - "concession_id"
        - "unit"
      "title": "ActorOut"
    "AdmissionBody":
      "properties":
        "family":
          "$ref": "#/components/schemas/PredicateFamily"
        "answers":
          "$ref": "#/components/schemas/AnswersBody"
        "justification_es":
          "anyOf":
            - "type": "string"
            - "type": "null"
          "title": "Justification Es"
      "additionalProperties": false
      "type": "object"
      "required":
        - "family"
        - "answers"
      "title": "AdmissionBody"
    "AdmissionCriterion":
      "type": "string"
      "enum":
        - "standard"
        - "remedy"
        - "subject"
      "title": "AdmissionCriterion"
      "description": "Criterio de la prueba de admisión que no se cumplió."
