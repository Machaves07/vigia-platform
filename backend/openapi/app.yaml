          "type": "string"
          "format": "uuid"
          "title": "Plant Id"
        "family":
          "$ref": "#/components/schemas/PredicateFamily"
        "answers":
          "$ref": "#/components/schemas/AnswersBody"
        "justification_es":
          "anyOf":
            - "type": "string"
            - "type": "null"
          "title": "Justification Es"
        "result":
          "$ref": "#/components/schemas/AdmissionResult"
        "failed_criterion":
          "anyOf":
            - "$ref": "#/components/schemas/AdmissionCriterion"
