      "properties":
        "clip_id":
          "$ref": "#/components/schemas/UUIDv7"
        "purpose":
          "$ref": "#/components/schemas/ClipUploadPurpose"
        "upload_url":
          "type": "string"
          "maxLength": 2048
          "minLength": 9
          "pattern": "^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?/[A-Za-z0-9._~:/?#\\[\\]@!$&'()*+,;=%-]*$"
          "title": "Upload Url"
