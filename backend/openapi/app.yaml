          "type": "string"
          "format": "uuid"
          "title": "Evaluated By"
        "role_in_use":
          "$ref": "#/components/schemas/Role"
        "evaluated_at":
          "type": "string"
          "title": "Evaluated At"
        "ledger_record_id":
          "type": "string"
          "format": "uuid"
          "title": "Ledger Record Id"
      "additionalProperties": false
      "type": "object"
      "required":
        - "admission_id"
