          "type": "string"
          "const": "PUT"
          "title": "Method"
        "expires_at":
          "$ref": "#/components/schemas/Timestamp"
        "max_size_bytes":
          "type": "integer"
          "maximum": 52428800.0
          "minimum": 1.0
          "title": "Max Size Bytes"
