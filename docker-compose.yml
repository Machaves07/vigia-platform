# Entorno local de vigia-platform (TASK-103, LC-NUC-36, PAT-NUC-MAN-07, NFR-NUC-49).
#
# Tres servicios, los mismos que usan las pruebas de integración con testcontainers:
#   - postgres        PostgreSQL 16
#   - localstack      LocalStack, edición comunitaria (S3 con sumas de verificación, KMS y
#                     Secrets Manager). Sin MinIO: su licencia AGPL está fuera de la lista
#                     permitida (tech-stack-decisions.md §2).
#   - otel-collector  colector de OpenTelemetry con receptor OTLP (4317 gRPC, 4318 HTTP)
#
# Uso: `docker compose up -d` (o `make up`, que espera a que los tres estén sanos),
# `docker compose ps`, `docker compose down -v` (borra también el volumen de la base).
#
# Imágenes fijadas por digest del índice multiplataforma; ninguna por `latest`. Para actualizar
# una: `docker buildx imagetools inspect <imagen>:<etiqueta>` y copiar el `Digest`. La imagen de
# PostgreSQL y la de LocalStack están repetidas en `backend/tests/integration/conftest.py`;
# `backend/tests/unit/test_local_environment.py` comprueba que coinciden.
#
# Solo datos generados (NFR-CTR-43). Las credenciales de abajo son valores fijos del entorno
# local, no secretos: los puertos solo escuchan en 127.0.0.1.

name: vigia-local

services:
  postgres:
    # postgres:16 → PostgreSQL 16.15 (Debian 13) al fijar el digest.
    image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    environment:
      POSTGRES_USER: vigia
      POSTGRES_PASSWORD: vigia_local
      POSTGRES_DB: vigia
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${VIGIA_LOCAL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=vigia --dbname=vigia --host=127.0.0.1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  localstack:
    # 4.14.0 es la última versión de la edición comunitaria (Apache-2.0). Desde 2026.03 la
    # imagen `localstack/localstack` exige una licencia (LOCALSTACK_AUTH_TOKEN) y no arranca sin ella.
    image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    environment:
      SERVICES: s3,kms,secretsmanager
      EAGER_SERVICE_LOADING: "1"
      AWS_DEFAULT_REGION: us-east-1
      # Sin telemetría hacia LocalStack y sin descargar su certificado de pruebas.
      DISABLE_EVENTS: "1"
      SKIP_SSL_CERT_DOWNLOAD: "1"
      # Valida las firmas SigV4 como S3: un PUT prefirmado sin la cabecera de suma firmada se
      # rechaza (TASK-112). LocalStack no las valida por defecto.
      S3_SKIP_SIGNATURE_VALIDATION: "0"
    ports:
      - "127.0.0.1:${VIGIA_LOCAL_LOCALSTACK_PORT:-4566}:4566"
    healthcheck:
      # Sano solo cuando S3, KMS y Secrets Manager están en marcha.
      test:
        - CMD
        - python3
        - -c
        - >-
          import json, sys, urllib.request;
          s = json.load(urllib.request.urlopen('http://127.0.0.1:4566/_localstack/health', timeout=3))['services'];
          sys.exit(0 if all(s.get(n) == 'running' for n in ('s3', 'kms', 'secretsmanager')) else 1)
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

  otel-collector:
    # Binario de otel/opentelemetry-collector-contrib:0.161.0 fijado por digest en el Dockerfile.
    build:
      context: ./local/otel-collector
    image: vigia-local/otel-collector:0.161.0
    pull_policy: build
    ports:
      - "127.0.0.1:${VIGIA_LOCAL_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${VIGIA_LOCAL_OTLP_HTTP_PORT:-4318}:4318"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/13133 && printf 'GET / HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s

volumes:
  postgres-data:
