# Actualizaciones de dependencias (TASK-143; deployment-architecture.md §3.1 de U-02; NFR-NUC-24).
#
# - Python del backend y de infra/: ecosistema `uv`, que actualiza `pyproject.toml` y `uv.lock` (el
#   diseño dice «pip»; con `uv.lock`, el ecosistema `pip` no tocaría el bloqueo).
# - npm de frontend/ (U-05): hasta que exista `frontend/package.json`, Dependabot avisa de que no
#   encuentra el manifiesto y no abre nada.
# - github-actions: sube el hash fijado y su comentario de versión (tests/unit/test_workflows_pinned.py
#   exige el hash completo).
# - docker: el digest de `python:3.12-slim` y de `uv` en backend/Dockerfile (imagen escaneada en
#   cada construcción).
#
# Las menores y los parches van agrupados en una sola solicitud por ecosistema: cada solicitud corre
# la canalización completa.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /infra
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      acciones:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
