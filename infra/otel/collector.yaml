# Colector lateral de vigia-api y vigia-worker (infrastructure-design §9.1, cierra R9).
#
# La pila vigia-compute (stacks/compute.py) entrega este archivo al contenedor `otel` en la
# variable AOT_CONFIG_CONTENT, que la distribución de AWS para OpenTelemetry (ADOT) lee al
# arrancar. Las referencias a variables de entorno (env:NOMBRE) las resuelve la pila al
# sintetizar con los valores de la tarea (CloudFormation no admite su sintaxis fuera de
# Fn::Sub), y el colector las resuelve igual si lee este archivo tal cual: nada de este archivo
# depende del despliegue. Validado arrancando la imagen fijada en config/pilot.py.
#
# - Receptor OTLP gRPC solo en la interfaz local de la tarea (localhost:4317).
# - Procesadores: límite de memoria, detección de recursos de ECS, filtro de atributos
#   (NFR-NUC-41), dimensiones fijas y lote de 5 s y 512 elementos.
# - Exportadores: `awsemf` (métricas al espacio Vigia/Platform con las dimensiones service,
#   environment, route y component; sin dimensiones de alta cardinalidad: node_id solo en las
#   ocho series por nodo de NFR-GOB-55, acotadas por la flota) y `awsxray` (trazas,
#   muestreo del 100 % en el piloto: el colector no muestrea). Los registros propios del
#   colector salen por la salida estándar hacia /vigia/<despliegue>/otel.
# - Fallo: la memoria del colector está acotada por memory_limiter (rechaza al receptor por
#   encima del 80 %) y el lote; los exportadores de AWS reintentan con el SDK y no admiten una
#   cola propia en esta versión. Si el colector cae, la aplicación descarta con el contador otel_dropped_total
#   (PAT-NUC-RES-03) y ECS reinicia el contenedor.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  resourcedetection:
    detectors: [env, ecs]
    timeout: 2s
    override: false

  # Lista blanca de NFR-NUC-41: la aplica la aplicación (AttributePolicy de
  # backend/src/vigia_platform/shared/observability/redaction.py), que solo emite
  # identificadores, enumeraciones cerradas, enteros acotados y booleanos declarados. ADOT no
  # trae el procesador `transform` (keep_keys), así que esta segunda barrera borra las familias
  # de atributos de texto libre o de red que la instrumentación automática podría añadir: URL,
  # cabeceras, agente de usuario, direcciones, identidad del usuario, sentencias SQL y mensajes
  # de excepción. En métricas, además, solo las dimensiones de `metric_declarations` llegan a
  # CloudWatch como dimensión.
  attributes/allowlist:
    actions:
      - pattern: ^(url|user_agent|client|server|source|destination|net|network|enduser|user|session|messaging|http\.request\.header|http\.response\.header)\..*
        action: delete
      - pattern: ^http\.(url|target|user_agent|client_ip|host|scheme|server_name|flavor)$
        action: delete
      - pattern: ^db\.(statement|query\.text|user|connection_string|name|namespace)$
        action: delete
      - pattern: ^exception\.(message|stacktrace)$
        action: delete

  # Dimensiones fijas de toda métrica de la tarea: el escalado del worker lee
  # outbox_oldest_pending_age_seconds con service y environment (stacks/compute.py).
  attributes/dimensions:
    actions:
      - key: service
        value: ${env:VIGIA_SERVICE}
        action: upsert
      - key: environment
        value: ${env:VIGIA_ENVIRONMENT}
        action: upsert

  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  awsemf:
    namespace: Vigia/Platform
    region: ${env:AWS_REGION}
    # Grupo de §9.2 (lo crea vigia-observability); cada tarea escribe en su propio flujo.
    log_group_name: ${env:VIGIA_OTEL_LOG_GROUP}
    log_stream_name: emf/${env:VIGIA_SERVICE}/{TaskId}
    dimension_rollup_option: NoDimensionRollup
    resource_to_telemetry_conversion:
      enabled: false
    # Una métrica sale con cada conjunto de dimensiones cuyas claves trae; las alarmas y el
    # tablero de vigia-observability (stacks/observability.py) separan por estos atributos de
    # observability.metrics, todos de lista cerrada y baja cardinalidad (NFR-NUC-41).
    metric_declarations:
      - dimensions:
          - [service, environment]
          - [service, environment, route]
          - [service, environment, component]
        metric_name_selectors:
          - ".*"
      - dimensions:
          - [service, environment, status_class]
          - [service, environment, route, status_class]
        metric_name_selectors:
          - "^http_server_(requests|errors)_total$"
      - dimensions:
          - [service, environment, rate_limit]
        metric_name_selectors:
          - "^rate_limited_total$"
      - dimensions:
          - [service, environment, operation]
        metric_name_selectors:
          - "^operation_duration_ms$"
      - dimensions:
          - [service, environment, task]
        metric_name_selectors:
          - "^(loop_)?periodic_task_last_success_age_seconds$"
      - dimensions:
          - [service, environment, result, task]
        metric_name_selectors:
          - "^(loop_)?periodic_task_duration_ms$"
      - dimensions:
          - [service, environment, pool_class]
        metric_name_selectors:
          - "^(db_pool|bulkhead)_(in_use|size)$"
          - "^bulkhead_(wait_ms|rejected_total)$"
      # Rutas del contrato (NFR-GOB-54): aceptados y rechazados por tipo de registro (la ruta).
      - dimensions:
          - [service, environment, result, route]
        metric_name_selectors:
          - "^node_requests_total$"
      # Series por nodo de NFR-GOB-55: solo estos contadores y medidores, nunca un histograma
      # (NFR-GOB-13: a lo sumo 8 por nodo). FLEET_PER_NODE_METRICS de stacks/observability.py.
      - dimensions:
          - [service, environment, node_id]
        metric_name_selectors:
          - "^fleet_(heartbeats_total|heartbeat_gap_seconds|node_reachable|node_queue_pending|node_clock_offset_ms)$"
          - "^clip_grants_(issued|used|orphaned)_total$"
      - dimensions:
          - [service, environment, organization_id, alarm_kind]
        metric_name_selectors:
          - "^fleet_alarms_open$"
      - dimensions:
          - [service, environment, alert_type]
        metric_name_selectors:
          - "^security_alert_total$"
      - dimensions:
          - [service, environment, app_version]
        metric_name_selectors:
          - "^health_ready$"
      # U-04 (TASK-332, NFR-LAZ-41, 42 y 44): la cola muerta y la entrega abierta más vieja por
      # consumidor (lista cerrada de nombres registrados), las solicitudes al asistente por estado
      # y las fichas y el presupuesto por organización. Alarmas y paneles de stacks/loop.py y
      # stacks/observability.py.
      - dimensions:
          - [service, environment, consumer]
        metric_name_selectors:
          - "^(dead_letter_created_total|outbox_oldest_pending_age_seconds)$"
          - "^loop_(consumer_pending|consumer_oldest_pending_age_seconds|dead_letter_entries_total)$"
      - dimensions:
          - [service, environment, organization_id, plant_id]
        metric_name_selectors:
          - "^loop_(unclassified_findings|unclassified_oldest_age_seconds|overdue_findings)$"
      - dimensions:
          - [service, environment, export_state]
          - [service, environment, organization_id, export_state]
        metric_name_selectors:
          - "^export_requests_total$"
      - dimensions:
          - [service, environment, export_state]
        metric_name_selectors:
          - "^export_duration_ms$"
      - dimensions:
          - [service, environment, organization_id]
        metric_name_selectors:
          - "^export_stuck_or_failed$"
      - dimensions:
          - [service, environment, email_state]
          - [service, environment, organization_id, email_state]
        metric_name_selectors:
          - "^email_messages_total$"
      - dimensions:
          - [service, environment, text_validator, verdict]
        metric_name_selectors:
          - "^loop_text_validations_total$"
      - dimensions:
          - [service, environment, assistant_state]
        metric_name_selectors:
          - "^assistant_request(s_total|_duration_ms)$"
      - dimensions:
          - [service, environment, organization_id, token_direction]
        metric_name_selectors:
          - "^assistant_tokens_total$"
      - dimensions:
          - [service, environment, organization_id]
        metric_name_selectors:
          - "^assistant_token_budget_used_ratio$"

  awsxray:
    region: ${env:AWS_REGION}
    indexed_attributes: [correlation_id]

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, attributes/allowlist, batch]
      exporters: [awsxray]
    metrics:
      receivers: [otlp]
      processors:
        [memory_limiter, resourcedetection, attributes/allowlist, attributes/dimensions, batch]
      exporters: [awsemf]
